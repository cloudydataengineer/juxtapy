[project]
name = "juxtapy"
version = "0.3.0"
description = "Row-by-row, column-by-column comparison of pandas/PySpark tables, ranked by mismatch."
readme = "README.md"
license = "MIT"
authors = [
    { email = "Chourasiya.avin@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
]

[project.optional-dependencies]
spark = ["pyspark>=3.3", "pyarrow>=10.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyspark>=3.3",
    "pyarrow>=10.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "spark: tests that require a local SparkSession (slow to start)",
]

[tool.ruff]
line-length = 100
src = ["src"]

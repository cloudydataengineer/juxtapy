name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --extra spark
      - run: uv run pytest
      - run: uv run ruff check src tests
